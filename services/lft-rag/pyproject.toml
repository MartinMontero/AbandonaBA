[project]
name = "lft-rag"
version = "0.1.0"
description = "RAG jurídico local sobre la Ley Federal del Trabajo (texto vigente de la Cámara de Diputados) con compuertas de decisión System One."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pymupdf>=1.24.10",
  "chromadb>=0.5.15",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.2.0",
  "transformers>=4.46.0",
  "accelerate>=1.0.0",
  "torch>=2.4.0",
  "typesafe-sdk>=0.4.0",
  "httpx>=0.27.2",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "typer>=0.12.5",
  "rich>=13.9.0",
  "numpy>=1.26.4",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.44.1; sys_platform == 'linux'"]
llamacpp = ["llama-cpp-python>=0.3.1"]
jeff = ["jeff-sdk>=1.4.2; python_version >= '3.13'"]
dev = ["pytest>=8.3.3", "pytest-cov>=5.0.0"]

[project.scripts]
lft-rag = "src.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# Torch de CPU en Windows/macOS sale de PyPI; en Linux se fuerza el índice de CPU para no bajar CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
