name: verify
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    # El runner de e2e usa PowerShell y taskkill (Windows).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verify
      - run: npm run verify:review

  lft-rag:
    # Servicio Python de «Consulta la LFT». Pruebas unitarias con backends simulados: no descarga modelos ni el PDF.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/lft-rag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --locked
      - run: uv run pytest -v
