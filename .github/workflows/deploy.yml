name: deploy (manual)
# Solo se ejecuta a mano. Cada fork debe crear sus propios secretos: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "production o review"
        required: true
        default: review
        type: choice
        options: [review, production]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build y despliegue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.target }}" = "production" ]; then
            npm run build
            npx wrangler deploy --env=""
          else
            npm run build:review
            npx wrangler deploy --env review
          fi
